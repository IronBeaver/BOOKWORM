plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bookworm.reader'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.bookworm.reader'
        minSdk 22
        targetSdk 35
        versionCode 11
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            // Keep the generated debug key inside the workspace.
            signingConfig signingConfigs.debug
        }
        release {
            // Preserve the established installed-user certificate; never replace the key.
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('.gradle-user-home/bookworm-debug.keystore')
        }
    }
}
